# 云端（VPS）—— FamilyPrint-Cloud
services:
  cloud:
    # image: ghcr.io/你的GitHub用户名/familyprint-cloud:latest   # 推荐：直接用 GHCR 自动构建镜像
    build: ./cloud-go           # 或本地构建
    container_name: fp-cloud
    restart: unless-stopped
    environment:
      - SECRET_KEY=请改成一段随机长字符串
      - DEVICE_TOKEN=请设置设备token，与家庭端一致
      - DATA_DIR=/app/data
      - LISTEN=:8000
    volumes:
      - cloud-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"   # 仅本机，由 Caddy 反代对外

  caddy:
    image: caddy:latest
    container_name: fp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  cloud-data:
  caddy-data:
