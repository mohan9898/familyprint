# 云端（VPS）—— FamilyPrint-Cloud 服务端
# 使用：修改下方 2 个「必改」值，然后 docker compose -f docker-compose.cloud.yml up -d
# 说明：本编排只提供服务端本体（HTTP :8000）；HTTPS 反向代理请使用你自己的方案
#       （Nginx / 宝塔 / 1Panel / 云厂商负载均衡等均可），反代目标 127.0.0.1:8000
services:
  cloud:
    image: ghcr.io/mohan9898/familyprint-cloud:latest   # GHCR 公共镜像，多架构 amd64/arm64/armv7 自动匹配
    # build: ./cloud-go                                  # 想本地构建则注释上一行、启用这一行
    container_name: fp-cloud
    restart: unless-stopped
    environment:
      # ↓↓↓ 必改：会话密钥（openssl rand -hex 32 生成）
      - SECRET_KEY=请改成一段随机长字符串
      # ↓↓↓ 必改：设备 token（与家庭端 docker-compose.agent.yml 中一致）
      - DEVICE_TOKEN=请设置设备token_与家庭端一致
      - DATA_DIR=/app/data
      - LISTEN=:8000
      # 日志级别：debug（最详细）/ info（默认）/ warn / error
      - LOG_LEVEL=info
    volumes:
      - cloud-data:/app/data
    ports:
      - "8000:8000"   # 服务端 HTTP 端口，供外部反向代理回源使用
    # 日志自动轮转：防止长期运行日志占满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cloud-data:
