# 云端（VPS）—— FamilyPrint-Cloud + Caddy 自动 HTTPS
# 使用：修改下方 2 个「必改」值 + Caddyfile 域名，然后 docker compose -f docker-compose.cloud.yml up -d
services:
  cloud:
    image: ghcr.io/mohan9898/familyprint-cloud:latest   # GHCR 公共镜像，多架构 amd64/arm64/armv7 自动匹配
    # build: ./cloud-go                                  # 想本地构建则注释上一行、启用这一行
    container_name: fp-cloud
    restart: unless-stopped
    environment:
      # ↓↓↓ 必改：会话密钥（openssl rand -hex 32 生成）
      - SECRET_KEY=请改成一段随机长字符串
      # ↓↓↓ 必改：设备 token（与家庭端 docker-compose.agent.yml 中一致）
      - DEVICE_TOKEN=请设置设备token_与家庭端一致
      - DATA_DIR=/app/data
      - LISTEN=:8000
    volumes:
      - cloud-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"   # 仅本机，由 Caddy 反代对外

  caddy:
    image: caddy:latest
    container_name: fp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  cloud-data:
  caddy-data:
