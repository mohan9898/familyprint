name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build all platforms
        run: bash build-all.sh "${{ github.ref_name }}"
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*/fp-*
            release/*/sha256sums.txt
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: familyprint-cloud
            context: ./cloud-go
          - name: familyprint-agent
            context: ./agent-go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # 把 metadata 算出的版本（如 1.4.1）注入二进制，容器内横幅不再显示 dev
          # 加 v 前缀与二进制产物（build-all.sh 用 git tag 名）保持一致
          build-args: |
            VERSION=v${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
