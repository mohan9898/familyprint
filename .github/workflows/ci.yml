name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [cloud-go, agent-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build ${{ matrix.component }}
        run: |
          cd ${{ matrix.component }}
          go vet ./...
          go build -o /dev/null .
