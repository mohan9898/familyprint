<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家印 · 家庭打印</title>
<style>
:root{
  --main:#4f7cff;--main-deep:#3b5fe0;
  --ok:#22a06b;--warn:#e8890c;--err:#e5484d;
  --bg:#f5f7fb;--card:#ffffff;
  --t1:#1c2333;--t2:#5b6472;--t3:#98a1b0;
  --line:#eef1f6;--radius:18px;
}
*{box-sizing:border-box;margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(79,124,255,.10), transparent 60%),
    var(--bg);
  color:var(--t1);min-height:100vh;
}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px calc(48px + env(safe-area-inset-bottom))}
h1{font-size:24px;font-weight:800;text-align:center;padding:22px 0 2px;letter-spacing:1px;color:var(--t1)}
h1 .logo{display:inline-flex;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--main),#7aa0ff);color:#fff;align-items:center;justify-content:center;font-size:19px;margin-right:8px;vertical-align:-8px;box-shadow:0 4px 12px rgba(79,124,255,.35)}
.sub-title{text-align:center;color:var(--t3);font-size:13px;margin-bottom:18px;letter-spacing:.5px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--t3);font-size:14px;margin-bottom:14px;padding:0 2px}
.top a{color:var(--t3);padding:6px 10px;border-radius:10px;transition:.2s}
.top a:active{background:rgba(0,0,0,.05)}
.card{
  background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:0 1px 2px rgba(28,35,51,.04),0 8px 24px rgba(28,35,51,.05);
  margin-bottom:16px;border:1px solid rgba(255,255,255,.7);
}
input,select{
  width:100%;padding:14px 14px;font-size:16px;color:var(--t1);
  border:1.5px solid var(--line);border-radius:13px;margin-bottom:12px;
  background:#fafbfd;outline:none;transition:.2s;appearance:none;
}
input:focus,select:focus{border-color:var(--main);background:#fff;box-shadow:0 0 0 4px rgba(79,124,255,.12)}
button{cursor:pointer;font-family:inherit}
.big{
  width:100%;padding:16px;font-size:17px;font-weight:600;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--main),var(--main-deep));color:#fff;letter-spacing:2px;
  box-shadow:0 6px 16px rgba(79,124,255,.35);transition:.2s;
}
.big:active{transform:scale(.98);box-shadow:0 3px 8px rgba(79,124,255,.3)}
.big[disabled]{background:#c3cad6;box-shadow:none}
.drop{
  border:1.5px dashed #c9d6f5;border-radius:14px;padding:34px 12px;text-align:center;
  color:var(--main-deep);font-size:16px;font-weight:500;background:linear-gradient(180deg,#f3f7ff,#fbfdff);
  cursor:pointer;transition:.2s;
}
.drop:active{background:#e9f0ff;transform:scale(.99)}
.drop .icon{display:block;font-size:34px;margin-bottom:8px}
.row{display:flex;gap:12px;margin:14px 0}
.row>div{flex:1}
.lbl{font-size:13px;color:var(--t2);margin-bottom:6px;font-weight:500}
.seg{display:flex;background:#f0f2f7;border-radius:12px;padding:3px;gap:2px}
.seg button{
  flex:1;padding:10px 2px;border:0;background:transparent;font-size:14px;color:var(--t2);
  border-radius:10px;transition:.2s;font-weight:500;
}
.seg button.on{background:#fff;color:var(--main-deep);font-weight:600;box-shadow:0 1px 4px rgba(28,35,51,.1)}
.info{
  margin:12px 0 2px;padding:11px 13px;background:#f3f7ff;border-radius:11px;
  font-size:14px;color:var(--main-deep);word-break:break-all;display:none;font-weight:500;
}
.tip{
  background:linear-gradient(135deg,#fff9ec,#fffdf6);border:1px solid #f5e3b3;border-radius:14px;
  padding:12px 14px;font-size:13px;color:#8a6116;line-height:1.7;margin-bottom:14px;display:none;
}
.state{
  text-align:center;margin-top:14px;padding:12px;border-radius:12px;
  background:#f0fbf4;color:var(--ok);font-size:15px;font-weight:500;display:none;
}
.records{font-size:14px}
.rec-title{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;color:var(--t1);margin-bottom:4px}
.rec-title a{color:var(--main);font-size:13px;font-weight:500}
.rec{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}
.rec .fname{font-weight:600;font-size:14.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .meta{color:var(--t3);font-size:12px;margin-top:3px}
.rec .right{text-align:right;flex-shrink:0;margin-left:10px}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:500}
.q{background:#eef1f6;color:var(--t2)}
.p{background:#fff2e3;color:var(--warn)}
.c{background:#e6f6ee;color:var(--ok)}
.x{background:#fdebec;color:var(--err)}
.cancel-link{color:var(--err);font-size:12px;margin-top:5px;display:inline-block}
.toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  background:rgba(28,35,51,.92);color:#fff;padding:11px 22px;border-radius:99px;
  font-size:14px;display:none;z-index:9;backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.18);
  max-width:86vw;text-align:center;
}
.empty{color:var(--t3);text-align:center;padding:20px;font-size:13.5px}
a{cursor:pointer}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap">
  <!-- 登录 -->
  <div id="login" hidden>
    <h1><span class="logo">🖨️</span>家印</h1>
    <p class="sub-title">全家人共用的家庭打印</p>
    <div class="card">
      <input id="u" placeholder="用户名" autocomplete="username">
      <input id="p" type="password" placeholder="密码" autocomplete="current-password">
      <button class="big" onclick="login()">登 录</button>
      <p class="empty" style="padding:12px 0 0">登录一次 · 30 天免密</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main" hidden>
    <h1><span class="logo">🖨️</span>家印</h1>
    <p class="sub-title">选文件 · 点打印 · 回家取</p>
    <div class="top"><span id="hello"></span><a onclick="logout()">退出</a></div>
    <div class="tip" id="wxTip">💡 微信里使用：点"选择文件"后选 <b>照片</b> 或 <b>浏览</b>；聊天里的文件先<b>长按→保存到手机</b>再选。建议右上角"···"→收藏本页。</div>
    <div class="card">
      <div class="drop" onclick="f.click()"><span class="icon">📄</span>点击选择要打印的文件<div style="font-size:12.5px;color:var(--t3);margin-top:6px;font-weight:400" id="sub">PDF / 图片 / Word / 文本，≤50MB</div></div>
      <input type="file" id="f" hidden accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png,.docx,.txt">
      <div class="info" id="finfo"></div>
      <div class="row">
        <div><div class="lbl">打印机</div><select id="pr"></select></div>
        <div><div class="lbl">份数</div><select id="cp"><option>1</option><option>2</option><option>3</option><option>5</option></select></div>
      </div>
      <div class="row">
        <div><div class="lbl">颜色</div><div class="seg" id="sc"><button data-v="0" class="on">黑白</button><button data-v="1">彩色</button></div></div>
        <div><div class="lbl">单双面</div><div class="seg" id="ss"><button data-v="one-sided" class="on">单面</button><button data-v="two-sided-long-edge">双面</button></div></div>
      </div>
      <div class="row"><div><div class="lbl">纸张</div><select id="pa"><option>A4</option><option>A5</option><option>Letter</option></select></div></div>
      <button class="big" id="go" onclick="doPrint()">开始打印</button>
      <div class="state" id="st" hidden></div>
    </div>
    <div class="card records">
      <div class="rec-title">打印记录<a onclick="loadJobs()">刷新</a></div>
      <div id="jobs"><p class="empty">加载中…</p></div>
    </div>
  </div>
</div>

<script>
let color=0,sides="one-sided",cur=0,timer=null;
const $=i=>document.getElementById(i);
const toast=m=>{const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)};
async function api(p,o={}){const r=await fetch(p,{credentials:"include",...o});
  if(r.status==401){show("login");throw 0}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||"操作失败");
  return d}
document.querySelectorAll(".seg").forEach(s=>s.onclick=e=>{
  if(e.target.tagName!="BUTTON")return;
  s.querySelectorAll("button").forEach(b=>b.classList.remove("on"));e.target.classList.add("on");
  if(s.id=="sc")color=+e.target.dataset.v;else sides=e.target.dataset.v});
$("f").onchange=e=>{const f=e.target.files[0];
  if(f){$("finfo").style.display="block";$("finfo").textContent="📎 "+f.name+"（"+(f.size/1048576).toFixed(1)+"MB）";$("st").hidden=true}};
$("f").onclick=e=>e.stopPropagation();

function show(id){for(const x of["login","main"])$(x).hidden=(x!=id)}
async function login(){try{
  await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("u").value.trim(),password:$("p").value})});
  enter()}catch(e){e&&toast(e.message||"登录失败")}}
async function logout(){await api("/api/logout",{method:"POST"});show("login")}

async function enter(){
  show("main");loadPrinters();loadJobs();
  try{const me=await api("/api/me");$("hello").textContent=(me.display_name||me.username)+"，欢迎"}catch(e){}
}
async function loadPrinters(){try{
  const l=await api("/api/printers");
  $("pr").innerHTML=l.map(p=>`<option>${p.name}${p.status!="online"?"（离线，可先排队）":""}</option>`).join("");
}catch(e){}}

// ---------- 端到端加密（AES-256-GCM，密钥由家庭密钥派生）----------
const E2EE_SALT=new TextEncoder().encode("familyprint-e2ee-v1"),E2EE_ITERS=100000;
function b64(u8){let s="";for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode(...u8.subarray(i,i+32768));return btoa(s)}
async function e2eeKey(){
  let pass=localStorage.getItem("fp_e2ee");
  if(!pass){
    pass=prompt("请输入家庭打印密钥（首次使用需向管理员索取，输一次即可）");
    if(!pass)throw new Error("未输入密钥");
    localStorage.setItem("fp_e2ee",pass);
  }
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:E2EE_SALT,iterations:E2EE_ITERS,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt"]);
}
async function e2eeEncrypt(file){
  const key=await e2eeKey();
  const data=new Uint8Array(await file.arrayBuffer());
  const inner=new TextEncoder().encode(JSON.stringify({n:file.name,m:file.type||"application/octet-stream",d:b64(data)}));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,inner));
  return new File([b64(iv)+"."+b64(ct)],"print.enc");
}
async function doPrint(){
  const f0=$("f").files[0];
  if(!f0)return toast("请先选择文件");
  let f=f0;
  try{f=await e2eeEncrypt(f0)}catch(e){return toast(e.message||"加密失败")}
  const fd=new FormData();
  fd.append("file",f);fd.append("printer",$("pr").value);fd.append("copies",$("cp").value);
  fd.append("color",color);fd.append("sides",sides);fd.append("paper",$("pa").value);
  $("go").disabled=true;$("go").textContent="正在发送…";
  try{
    const j=await api("/api/print-jobs",{method:"POST",body:fd});
    cur=j.id;$("f").value="";$("finfo").style.display="none";
    $("st").hidden=false;$("st").style.display="block";$("st").innerHTML="✅ 已发送到打印机，<span id='js'>排队中</span>——回家取件即可";
    timer=setInterval(poll,4000);loadJobs();
  }catch(e){toast(e.message)}
  $("go").disabled=false;$("go").textContent="开始打印";
}
const TXT={queued:"排队中",processing:"打印中…",completed:"已完成 ✅",canceled:"已取消",failed:"失败"};
async function poll(){
  if(!cur)return;
  try{
    const jobs=await api("/api/print-jobs");const j=jobs.find(x=>x.id==cur);
    if(j){$("js").textContent=TXT[j.status]||j.status;
      if(["completed","canceled","failed"].includes(j.status)){clearInterval(timer);cur=0;loadJobs()}}
  }catch(e){}
}
async function loadJobs(){
  try{
    const jobs=await api("/api/print-jobs");
    $("jobs").innerHTML=jobs.length?jobs.slice(0,10).map(j=>
      `<div class="rec"><div><div class="fname">${j.orig_name}</div><div class="meta">${j.created_at} · ${j.copies}份 · ${j.color?"彩色":"黑白"} · ${j.sides.startsWith("two")?"双面":"单面"}</div></div>
      <div class="right"><span class="badge ${{queued:"q",processing:"p",completed:"c",canceled:"x",failed:"x"}[j.status]||"q"}">${TXT[j.status]||j.status}</span>
      ${j.status=="queued"?`<br><a class="cancel-link" onclick="cancel(${j.id})">取消</a>`:""}</div></div>`).join("")
    :"<p class='empty'>还没有打印记录</p>";
  }catch(e){}
}
async function cancel(id){try{await api(`/api/print-jobs/${id}/cancel`,{method:"POST"});loadJobs();toast("已取消")}catch(e){toast(e.message)}}

(async()=>{
  if(navigator.userAgent.toLowerCase().includes("micromessenger")){
    $("wxTip").style.display="block";
    if(/iphone|ipad/.test(navigator.userAgent.toLowerCase()))$("sub").textContent="苹果手机选文件时点\"浏览\"，从文件 App 里选";
  }
  try{await api("/api/me");enter()}catch(e){}
})();
</script>
</body>
</html>
